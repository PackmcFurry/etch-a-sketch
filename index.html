<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Etch-A-Sketch</h1>

        <button id="reset">Reset</button>

        <div id="menu">
            <div>
                <label for="nBlocks">Blocks</label>
                <input type="range" id="nBlocks" min="1" max="100" value="16"  autocomplete="off">
                <output id="val">16</output>
            </div>
            <div>
                <label for="randomColor">Random Colors:</label>
                <input type="checkbox" name="randomColor" id="randomColor">
                <label for="opacity">Opacity changer:</label>
                <input type="checkbox" name="opacity" id="opacity">
            </div>
        </div>
    </header>
    
    <div id="container">
        
    </div>
</body>
</html>
